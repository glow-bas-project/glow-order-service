# HTTP
quarkus.http.port=8080

# OIDC / Keycloak
# quarkus.oidc.auth-server-url=http://localhost:8080/realms/glow-realm
# quarkus.oidc.client-id=glow-order-service
# quarkus.oidc.credentials.secret=<your-client-secret>
    # The client secret can be found in the Keycloak admin console under:
    # glow-realm > Clients > glow-order-service > Credentials -> Client Secret

# Payment service integration
quarkus.rest-client.payment-api.url=${PAYMENT_SERVICE_URL:http://glow-payment:8080}

# Restaurant service integration
quarkus.rest-client.restaurant-api.url=${RESTAURANT_SERVICE_URL:http://glow-restaurant:8080}

# Hibernate
quarkus.hibernate-orm.mapping.format.global=ignore

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog.sql
quarkus.hibernate-orm.schema-management.strategy=none

# Kafka – disabled for now, until glow-devops is updated
